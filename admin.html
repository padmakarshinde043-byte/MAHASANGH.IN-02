<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>महासंघ Admin</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#102a43;background:#f6f1e8}*{box-sizing:border-box}body{margin:0}.top{background:#102a43;color:#fff;padding:20px 16px;position:sticky;top:0;z-index:3}.top h1{margin:0;font-size:22px}.top p{margin:5px 0 0;color:#cbd5e1;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:16px}.login,.card{background:#fff;border:1px solid #e5ddd1;border-radius:18px;padding:18px;box-shadow:0 8px 28px #102a4310}.login{max-width:440px;margin:30px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 16px;position:sticky;top:84px;background:#f6f1e8;z-index:2}.tabs button{border:1px solid #d8cbbb;background:#fff;color:#102a43;border-radius:999px;padding:10px 14px;white-space:nowrap;font-weight:700}.tabs button.active{background:#e87512;color:#fff;border-color:#e87512}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cfc4b6;border-radius:10px;font:inherit;background:#fff}textarea{min-height:110px;resize:vertical}.primary{margin-top:14px;background:#e87512;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.secondary{background:#102a43;color:#fff;border:0;border-radius:10px;padding:10px 14px}.hidden{display:none}.status{padding:10px 12px;border-radius:10px;background:#eef6ee;margin:12px 0;font-size:14px}.error{background:#fff0f0;color:#a33}.muted{color:#64748b;font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.logout{float:right;background:transparent;border:1px solid #789;color:#fff;border-radius:8px;padding:7px 10px}.hint{background:#fff8ed;border-left:4px solid #e87512;padding:12px;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<header class="top"><button class="logout hidden" id="logout">बाहेर पडा</button><h1>महासंघ व्यवस्थापन</h1><p>मोबाईलवरून बातम्या, फोटो, पदाधिकारी, GR आणि सदस्यत्व व्यवस्थापित करा</p></header>
<main class="wrap">
<section id="login" class="login"><h2>Admin Login</h2><p class="muted">Firebase Authentication वापरून सुरक्षित प्रवेश.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="primary" id="loginBtn">Login करा</button><div id="loginMsg" class="status hidden"></div></section>
<section id="app" class="hidden"><div class="hint">डेटा संबंधित Firebase project मध्ये जतन होतो. फोटो upload करताना शक्य असल्यास WebP/JPEG वापरा.</div><nav class="tabs" id="tabs"><button data-tab="news">बातम्या</button><button data-tab="gallery">फोटो गॅलरी</button><button data-tab="officers">पदाधिकारी</button><button data-tab="documents">महत्त्वाचे GR</button><button data-tab="membership">सदस्यत्व</button><button data-tab="website">वेबसाइट माहिती</button></nav><div id="panel"></div></section>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,addDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getStorage,ref,uploadBytes,getDownloadURL} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';
const $=id=>document.getElementById(id);let configs,apps={},active='news';
const schemas={news:{title:'बातमी जोडा',collection:'news',fields:[['headline','मुख्य heading','text'],['body','बातमीचा मजकूर','textarea']]},gallery:{title:'फोटो जोडा',collection:'gallery',fields:[['caption','Caption','text'],['description','थोडक्यात वर्णन','textarea'],['image','फोटो','file']]},officers:{title:'पदाधिकारी जोडा',collection:'officers',fields:[['name','पूर्ण नाव','text'],['role','पद / जिल्हा','text'],['phone','मोबाईल नंबर','tel'],['photo','फोटो','file']]},documents:{title:'महत्त्वाचा GR जोडा',collection:'documents',fields:[['title','शीर्षक','text'],['description','वर्णन','textarea'],['pdf','PDF फाइल','file']]},membership:{title:'सदस्यत्व अर्ज नोंदवा',collection:'members',fields:[['name','सदस्याचे नाव','text'],['address','संपूर्ण पत्ता','textarea'],['phone','WhatsApp नंबर','tel'],['status','स्थिती','select']]},website:{title:'वेबसाइट माहिती',collection:'content',fields:[['key','माहितीचा key','text'],['value','माहिती','textarea']]}};
function showMsg(text,error=false){const el=$('loginMsg');el.textContent=text;el.className='status'+(error?' error':'');el.classList.remove('hidden')}
function render(tab){active=tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const s=schemas[tab];$('panel').innerHTML='<div class="card"><div class="section-title"><h2>'+s.title+'</h2><span class="muted">Firebase: '+tab+'</span></div><form id="dataForm" class="grid">'+s.fields.map(([id,label,type])=>type==='textarea'?`<div><label>${label}</label><textarea name="${id}" required></textarea></div>`:type==='select'?`<div><label>${label}</label><select name="${id}"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div>`:`<div><label>${label}</label><input name="${id}" type="${type}" ${type==='file'?'accept="image/*,.pdf"':''} ${type!=='file'?'required':''}></div>`).join('')}<div><button class="primary" type="submit">जतन करा</button></div></form><p id="saveMsg" class="muted"></p></div>';$('dataForm').addEventListener('submit',saveRecord)}
async function saveRecord(e){e.preventDefault();const s=schemas[active],form=new FormData(e.target),data={createdAt:serverTimestamp()};for(const [id] of s.fields){const value=form.get(id);if(value instanceof File&&value.size){const storage=getStorage(apps[active]);const path=`${s.collection}/${Date.now()}-${value.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;const r=ref(storage,path);await uploadBytes(r,value);data[id+'Url']=await getDownloadURL(r);data[id+'Name']=value.name}else if(typeof value==='string')data[id]=value}await addDoc(collection(getFirestore(apps[active]),s.collection),data);$('saveMsg').textContent='माहिती यशस्वीरीत्या जतन झाली.';e.target.reset()}
async function boot(){const res=await fetch('/api/firebase-config');configs=await res.json();for(const [key,config] of Object.entries(configs)){apps[key]=initializeApp(config,key)};for(const [key,app] of Object.entries(apps)){const auth=getAuth(app);if(key==='membership'||key==='officers')onAuthStateChanged(auth,user=>{if(user)showApp()})}render('news')}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');render(active)}
$('loginBtn').addEventListener('click',async()=>{try{const app=apps.officers||apps.membership;await signInWithEmailAndPassword(getAuth(app),$('email').value,$('password').value);showApp()}catch(error){showMsg('Login अयशस्वी: '+error.message,true)}});$('logout').addEventListener('click',()=>signOut(getAuth(apps.officers||apps.membership)));$('tabs').addEventListener('click',e=>{if(e.target.matches('button[data-tab]'))render(e.target.dataset.tab)});boot().catch(e=>showMsg('Firebase config लोड झाली नाही: '+e.message,true));
</script>
</body></html>
