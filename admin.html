<!doctype html>
<html lang="mr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>महासंघ व्यवस्थापन</title><style>
:root{font-family:system-ui,sans-serif;color:#102a43;background:#f6f1e8}*{box-sizing:border-box}body{margin:0}.top{background:#102a43;color:#fff;padding:18px;position:sticky;top:0;z-index:3}.top h1{margin:0;font-size:22px}.top p{margin:5px 0 0;color:#cbd5e1;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:16px}.login,.card{background:#fff;border:1px solid #e5ddd1;border-radius:18px;padding:18px;box-shadow:0 8px 28px #102a4310}.login{max-width:440px;margin:30px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 16px;position:sticky;top:77px;background:#f6f1e8;z-index:2}.tabs button{border:1px solid #d8cbbb;background:#fff;color:#102a43;border-radius:999px;padding:10px 14px;white-space:nowrap;font-weight:700}.tabs button.active{background:#e87512;color:#fff;border-color:#e87512}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cfc4b6;border-radius:10px;font:inherit;background:#fff}textarea{min-height:110px}.primary,.secondary,.danger{margin-top:14px;border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#e87512;color:#fff}.secondary{background:#102a43;color:#fff}.danger{background:#b42318;color:#fff}.hidden{display:none}.status{padding:10px 12px;border-radius:10px;background:#eef6ee;margin:12px 0;font-size:14px}.error{background:#fff0f0;color:#a33}.muted{color:#64748b;font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.logout{float:right;background:transparent;border:1px solid #789;color:#fff;border-radius:8px;padding:7px 10px}.hint{background:#fff8ed;border-left:4px solid #e87512;padding:12px;margin-bottom:14px;font-size:14px}.records{margin-top:18px;display:grid;gap:10px}.record{border:1px solid #e2e8f0;border-radius:12px;padding:12px;background:#fbfdff}.record-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.record img{width:72px;height:72px;object-fit:cover;border-radius:8px}.record-actions{display:flex;gap:8px;flex-wrap:wrap}.record-actions button{padding:7px 10px;border:0;border-radius:7px;cursor:pointer;font-weight:700}.approve{background:#dcfce7;color:#166534}.reject{background:#fee2e2;color:#991b1b}.small{font-size:12px;color:#64748b}.preview{max-width:100%;max-height:180px;border-radius:10px;margin-top:8px}@media(max-width:600px){.record-top{flex-direction:column}}
</style></head><body>
<header class="top"><button class="logout hidden" id="logout">बाहेर पडा</button><h1>महासंघ व्यवस्थापन</h1><p>मोबाईलवरून बातम्या, फोटो, पदाधिकारी, GR आणि सदस्यत्व व्यवस्थापित करा</p></header><main class="wrap">
<section id="login" class="login"><h2>Admin Login</h2><p class="muted">Firebase Authentication वापरून सुरक्षित प्रवेश.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="primary" id="loginBtn">Login करा</button><div id="loginMsg" class="status hidden"></div></section>
<section id="app" class="hidden"><div class="hint">फोटो आपोआप WebP मध्ये optimize होतो. Membership अर्ज येथे मंजूर किंवा नाकारता येतील.</div><nav class="tabs" id="tabs"><button data-tab="news">बातम्या</button><button data-tab="gallery">फोटो गॅलरी</button><button data-tab="officers">पदाधिकारी</button><button data-tab="documents">महत्त्वाचे GR</button><button data-tab="membership">सदस्यत्व</button><button data-tab="website">वेबसाइट माहिती</button></nav><div id="panel"></div></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,collection,addDoc,serverTimestamp,getDocs,query,orderBy,updateDoc,doc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';
const $=id=>document.getElementById(id);let apps={},active='news';const schemas={news:{title:'बातमी जोडा',collection:'news',fields:[['headline','मुख्य heading','text'],['body','बातमीचा मजकूर','textarea'],['image','फोटो','file']],app:'news'},gallery:{title:'फोटो जोडा',collection:'gallery',fields:[['caption','Caption','text'],['description','थोडक्यात वर्णन','textarea'],['image','फोटो','file']],app:'gallery'},officers:{title:'पदाधिकारी जोडा',collection:'officers',fields:[['name','पूर्ण नाव','text'],['role','पद / जिल्हा','text'],['phone','मोबाईल नंबर','tel'],['photo','फोटो','file']],app:'officers'},documents:{title:'महत्त्वाचा GR जोडा',collection:'documents',fields:[['title','शीर्षक','text'],['description','वर्णन','textarea'],['pdf','PDF फाइल','file']],app:'documents'},membership:{title:'सदस्यत्व अर्ज',collection:'members',fields:[['name','सदस्याचे नाव','text'],['address','संपूर्ण पत्ता','textarea'],['phone','WhatsApp नंबर','tel']],app:'membership'},website:{title:'वेबसाइट माहिती',collection:'content',fields:[['key','माहितीचा key','text'],['value','माहिती','textarea']],app:'website'}};
function msg(text,error=false){const x=$('loginMsg');x.textContent=text;x.className='status'+(error?' error':'');x.classList.remove('hidden')}
function formHtml(s){return'<form id="dataForm" class="grid">'+s.fields.map(([id,label,type])=>`<div><label>${label}</label>${type==='textarea'?`<textarea name="${id}" required></textarea>`:`<input name="${id}" type="${type}" ${type==='file'?'accept="image/*,.pdf"':''} ${type!=='file'?'required':''}`}</div>`).join('')+'<div><button class="primary">जतन करा</button></div></form><p id="saveMsg" class="muted"></p>'}
function render(tab){active=tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const s=schemas[tab];$('panel').innerHTML=`<div class="card"><div class="section-title"><h2>${s.title}</h2><span class="muted">${s.app}</span></div>${formHtml(s)}<div id="records" class="records"><p class="muted">डेटा लोड होत आहे...</p></div></div>`;$('dataForm').addEventListener('submit',saveRecord);loadRecords(s)}
async function compress(file){if(!file.type.startsWith('image/'))return file;const b=await createImageBitmap(file),max=1800,scale=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*scale);c.height=Math.round(b.height*scale);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(x=>r(new File([x],file.name.replace(/\.[^.]+$/,'.webp'),{type:'image/webp'})),'image/webp',.82))}
async function saveRecord(e){e.preventDefault();const s=schemas[active],data={createdAt:serverTimestamp(),updatedAt:serverTimestamp()};try{for(const[id]of s.fields){const v=new FormData(e.target).get(id);if(v instanceof File&&v.size){if(v.size>15*1024*1024)throw Error('फाइल 15MB पेक्षा कमी असावी');const f=await compress(v),r=ref(getStorage(apps[s.app]),`${s.collection}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`);await uploadBytes(r,f);data[id+'Url']=await getDownloadURL(r);data[id+'Name']=f.name}else if(typeof v==='string'&&v.trim())data[id]=v}if(active==='membership'){data.status='pending';data.membershipNumber=''}await addDoc(collection(getFirestore(apps[s.app]),s.collection),data);$('saveMsg').textContent='माहिती यशस्वीरीत्या जतन झाली.';e.target.reset();loadRecords(s)}catch(err){$('saveMsg').textContent='जतन अयशस्वी: '+err.message;$('saveMsg').className='error'}}
async function loadRecords(s){const box=$('records');try{const snap=await getDocs(query(collection(getFirestore(apps[s.app]),s.collection),orderBy('createdAt','desc')));if(snap.empty){box.innerHTML='<p class="muted">अजून नोंदी नाहीत.</p>';return}box.innerHTML=snap.docs.map(d=>{const x=d.data(),date=x.createdAt?.toDate?x.createdAt.toDate().toLocaleString('mr-IN'):'नवीन';const image=x.imageUrl||x.photoUrl;const controls=active==='membership'?`<button class="approve" data-action="approve" data-id="${d.id}" data-phone="${x.phone||''}">मंजूर</button><button class="reject" data-action="reject" data-id="${d.id}">नाकार</button>`:'';return`<article class="record"><div class="record-top"><div><strong>${x.headline||x.caption||x.name||x.title||x.key||'नोंद'}</strong><div class="small">${date} ${x.status?' · '+x.status:''} ${x.membershipNumber?' · सदस्य क्र. '+x.membershipNumber:''}</div><div>${x.body||x.description||x.address||x.role||''}</div>${x.phone?`<div>WhatsApp: ${x.phone}</div>`:''}${image?`<img class="preview" src="${image}" alt="फोटो">`:''}${x.pdfUrl?`<p><a href="${x.pdfUrl}" target="_blank">PDF उघडा</a></p>`:''}${active==='membership'&&['aadhaarPath','passportPath','paymentPath'].some(k=>x[k])?`<p class="small">Documents सुरक्षित Storage मध्ये जतन झाले आहेत.</p>`:''}</div><div class="record-actions">${controls}</div></div></article>`}).join('');box.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>updateMembership(b.dataset.id,b.dataset.action,b.dataset.phone,s))}catch(err){box.innerHTML='<p class="error">नोंदी लोड करता आल्या नाहीत: '+err.message+'</p>'}}
async function updateMembership(id,action,phone,s){const number=action==='approve'?await nextNumber():'';await updateDoc(doc(getFirestore(apps.membership),'members',id),{status:action==='approve'?'approved':'rejected',membershipNumber:number,updatedAt:serverTimestamp()});await updateDoc(doc(getFirestore(apps.membership),'membership_status',id),{status:action==='approve'?'approved':'rejected',membershipNumber:number,updatedAt:serverTimestamp()});loadRecords(s)}
async function nextNumber(){const snap=await getDocs(collection(getFirestore(apps.membership),'members'));const max=snap.docs.reduce((m,d)=>Math.max(m,parseInt(d.data().membershipNumber||'0',10)||0),0);return String(max+1).padStart(4,'0')}
async function boot(){try{msg('Firebase तयार होत आहे...');const response=await fetch('/api/firebase-config');if(!response.ok)throw Error('Firebase config endpoint उपलब्ध नाही');const cfg=await response.json();if(!cfg.membership?.apiKey)throw Error('mh-membership Firebase config उपलब्ध नाही');for(const[k,v]of Object.entries(cfg))apps[k]=initializeApp(v,k);onAuthStateChanged(getAuth(apps.membership),u=>{if(u)showApp()});render('news');$('loginBtn').disabled=false;$('loginBtn').textContent='Login करा';msg('')}catch(e){$('loginBtn').disabled=true;msg('Firebase सुरू झाले नाही: '+e.message,true)}}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');render(active)}
$('loginBtn').onclick=async()=>{if(!apps.membership){msg('Firebase अजून तयार झालेले नाही. पेज refresh करा.',true);return}const button=$('loginBtn');button.disabled=true;button.textContent='तपासत आहे...';try{await signInWithEmailAndPassword(getAuth(apps.membership),$('email').value.trim(),$('password').value);showApp()}catch(e){const text=e.code==='auth/invalid-credential'?'Email किंवा password चुकीचा आहे.':e.code==='auth/too-many-requests'?'खूप प्रयत्न झाले. थोड्या वेळाने पुन्हा प्रयत्न करा.':e.message;msg('Login अयशस्वी: '+text,true);button.disabled=false;button.textContent='Login करा'}};$('logout').onclick=()=>signOut(getAuth(apps.officers));$('tabs').onclick=e=>{if(e.target.matches('button[data-tab]'))render(e.target.dataset.tab)};boot().catch(e=>msg('Firebase config लोड झाली नाही: '+e.message,true));
</script></body></html>
