<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | महासंघ व्यवस्थापन</title>
<style>
:root{--navy:#102a43;--orange:#ef7608;--cream:#f7f3eb;--line:#d9e2ec;--muted:#61758a;--green:#087443;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:var(--navy);color:#fff;padding:20px max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header h1{font-size:22px;margin:0}header p{font-size:13px;color:#d5e0ea;margin:4px 0 0}.wrap{max-width:1100px;margin:auto;padding:28px 18px 64px}.login,.panel-card{max-width:820px;margin:30px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 30px #102a4314}.login{max-width:440px}.hidden{display:none!important}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.tabs button{border:1px solid #d7c9b9;border-radius:999px;background:#fff;color:var(--navy);padding:10px 16px;cursor:pointer}.tabs button.active,.primary{background:var(--orange);border-color:var(--orange);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid>div:has(textarea),.grid>div:has(input[type=file]),.grid>div:last-child{grid-column:1/-1}label{display:block;font-weight:700;font-size:14px;margin:0 0 6px}input,textarea,select{width:100%;border:1px solid #c7d2df;border-radius:10px;background:#fff;color:var(--navy);padding:12px;font:inherit}textarea{min-height:130px;resize:vertical}.primary{border:0;border-radius:9px;padding:12px 18px;font-weight:800;cursor:pointer}.primary:disabled{opacity:.6;cursor:wait}.muted{color:var(--muted)}.status{margin-top:12px;padding:10px;border-radius:8px;background:#eaf8f0;color:var(--green)}.status.error{background:#fff0f0;color:var(--red)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.section-head h2{margin:0 0 5px}.records{display:grid;gap:12px;margin-top:24px}.record{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fbfdff}.record.clickable{cursor:pointer}.record.clickable:hover{border-color:var(--orange);box-shadow:0 4px 14px #102a4312}.record-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.record h3{margin:0 0 4px;font-size:17px}.record-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.record-actions .primary{padding:8px 12px;font-size:13px}.record p{margin:4px 0;color:var(--muted)}.badge{display:inline-block;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}.pending{background:#fff4d6;color:#8a5700}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.modal{position:fixed;inset:0;background:#102a4366;display:grid;place-items:center;padding:18px;z-index:20}.modal-card{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:24px}.modal-card h2{margin-top:0}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.detail{border-bottom:1px solid var(--line);padding:8px 0}.detail strong{display:block;font-size:12px;color:var(--muted)}.doc-links{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.doc-links a{padding:8px 12px;border-radius:8px;background:#e8f0f7;color:var(--navy);font-weight:700;text-decoration:none}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.approve,.reject{border:0;border-radius:8px;padding:11px 16px;color:#fff;font-weight:800;cursor:pointer}.approve{background:#138a50}.reject{background:#c43232}.close{background:#e6edf3;color:var(--navy);border:0;border-radius:8px;padding:11px 16px;font-weight:800;cursor:pointer}@media(max-width:680px){header{align-items:flex-start;flex-direction:column}.grid,.detail-grid{grid-template-columns:1fr}.grid>div:has(textarea),.grid>div:has(input[type=file]),.grid>div:last-child{grid-column:auto}.section-head,.record-head{flex-direction:column}.tabs button{padding:8px 11px;font-size:13px}}
</style>
</head>
<body>
<header><div><h1>महासंघ व्यवस्थापन</h1><p>बातम्या, फोटो, पदाधिकारी, GR आणि सदस्यत्व सुरक्षितपणे व्यवस्थापित करा</p></div><button id="logout" class="close hidden">बाहेर पडा</button></header>
<main class="wrap">
<section id="login" class="login"><h2>Admin Login</h2><p class="muted">mh-membership Firebase Authentication वापरा.</p><label for="email">Email</label><input id="email" type="email" autocomplete="username"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="primary" type="button">Login करा</button><div id="loginMsg" class="status hidden"></div></section>
<section id="app" class="hidden"><nav class="tabs" id="tabs" aria-label="Admin sections"><button data-tab="news">बातम्या</button><button data-tab="gallery">फोटो गॅलरी</button><button data-tab="officers">पदाधिकारी</button><button data-tab="documents">महत्त्वाचे GR</button><button data-tab="membership">सदस्यत्व</button><button data-tab="website">वेबसाइट माहिती</button></nav><div id="panel"></div></section>
</main>
<div id="modalRoot"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,collection,addDoc,setDoc,serverTimestamp,getDocs,getDoc,query,orderBy,doc,updateDoc,limit}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';
const $=id=>document.getElementById(id);let app,auth,db,storage,active='news';
const schemas={
 news:{title:'बातमी जोडा',fields:[['headline','मुख्य heading','text'],['body','बातमीचा मजकूर','textarea'],['image','फोटो','file']]},
 gallery:{title:'फोटो जोडा',fields:[['caption','Caption','text'],['description','थोडक्यात वर्णन','textarea'],['image','फोटो','file']]},
 officers:{title:'पदाधिकारी जोडा',fields:[['name','पूर्ण नाव','text'],['role','पद / जिल्हा','text'],['phone','मोबाईल नंबर','tel'],['photo','फोटो','file']]},
 documents:{title:'महत्त्वाचा GR जोडा',fields:[['title','शीर्षक','text'],['description','वर्णन','textarea'],['pdf','PDF फाइल','file']]},
 website:{title:'वेबसाइट माहिती संपादित करा',fields:[['pageKey','पेज निवडा','page'],['currentTitle','सध्याचे पेज शीर्षक','readonly'],['currentBody','सध्याचा पेज मजकूर व माहिती','readonlyTextarea'],['title','नवीन पेजचे शीर्षक','text'],['body','नवीन पेजमधील माहिती','textarea']]}
};
const pages=[['home','मुख्यपृष्ठ'],['news','बातम्या'],['gallery','फोटो गॅलरी'],['officers','पदाधिकारी'],['documents','महत्त्वाचे GR'],['membership','सदस्यत्व'],['contact','संपर्क']];
const setMessage=(text,error=false)=>{const el=$('loginMsg');el.textContent=text;el.className='status'+(error?' error':'');el.classList.remove('hidden')};
const saveMessage=(text,error=false)=>{const el=$('saveMsg');if(!el)return;el.textContent=text;el.className='status'+(error?' error':'');el.classList.remove('hidden')};
const escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const dateValue=v=>v?.toDate?v.toDate().toLocaleString('mr-IN'):'नवीन';
function formHtml(s){return`<form id="dataForm" class="grid">${s.fields.map(([id,label,type])=>`<div><label for="${id}">${label}</label>${type==='textarea'||type==='readonlyTextarea'?`<textarea id="${id}" name="${id}" ${type==='readonlyTextarea'?'readonly class="readonly-field"':''} ${id==='body'?'required':''}></textarea>`:type==='page'?`<select id="${id}" name="${id}" required>${pages.map(([key,name])=>`<option value="${key}">${name}</option>`).join('')}</select>`:type==='readonly'?`<input id="${id}" name="${id}" type="text" readonly class="readonly-field">`:`<input id="${id}" name="${id}" type="${type}" accept="${type==='file'?'image/*,.pdf':''}" ${type!=='file'?'required':''}>`}</div>`).join('')}<div><button class="primary" id="saveBtn">जतन करा</button></div></form><p id="saveMsg" class="muted"></p>`}
async function optimize(file){if(!file.type.startsWith('image/'))return file;try{const bitmap=await createImageBitmap(file),max=1800,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);return await new Promise(resolve=>canvas.toBlob(blob=>resolve(new File([blob],file.name.replace(/\.[^.]+$/,'.webp'),{type:'image/webp'})),'image/webp',.82))}catch{return file}}
async function upload(file,path){if(file.size>20*1024*1024)throw Error('फाइल 20MB पेक्षा कमी असावी');const optimized=await optimize(file),fileRef=ref(storage,`${path}/${Date.now()}-${optimized.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`);await uploadBytes(fileRef,optimized);return{path:fileRef.fullPath,url:await getDownloadURL(fileRef)}}
async function saveRecord(event){event.preventDefault();const form=new FormData(event.target),data={createdAt:serverTimestamp(),updatedAt:serverTimestamp()};const saveBtn=$('saveBtn');saveBtn.disabled=true;saveBtn.textContent='जतन होत आहे...';try{if(active==='website'){const pageKey=form.get('pageKey');data.title=String(form.get('title')||'');data.body=String(form.get('body')||'');data.pageKey=pageKey;await setDoc(doc(db,'website',pageKey),data,{merge:true});saveMessage('वेबसाइट माहिती जतन झाली.');await loadWebsite(pageKey);return}for(const[id]of schemas[active].fields){const value=form.get(id);if(value instanceof File&&value.size){const uploaded=await upload(value,active);data[id+'Url']=uploaded.url;data[id+'Path']=uploaded.path}else if(typeof value==='string'&&value.trim())data[id]=value.trim()}await addDoc(collection(db,active),data);event.target.reset();saveMessage('माहिती यशस्वीरीत्या जतन झाली.');await loadRecords(active)}catch(error){saveMessage(error.message||'जतन करताना अडचण आली.',true)}finally{saveBtn.disabled=false;saveBtn.textContent='जतन करा'}}
async function loadWebsite(pageKey){const snap=await getDoc(doc(db,'website',pageKey));const data=snap.exists()?snap.data():{};const file=pageKey==='home'?'index.html':`${pageKey}.html`;let currentTitle='',currentBody='';try{const response=await fetch(`/${file}`,{cache:'no-store'});const html=await response.text();const parsed=new DOMParser().parseFromString(html,'text/html');currentTitle=parsed.title||'';parsed.querySelectorAll('script,style,header,nav,footer').forEach(node=>node.remove());currentBody=(parsed.body?.innerText||'').replace(/\n{3,}/g,'\n\n').trim()}catch{currentTitle='सध्याचे पेज शीर्षक उपलब्ध नाही';currentBody='सध्याचा मजकूर लोड करता आला नाही.'}$('currentTitle').value=currentTitle;$('currentBody').value=currentBody;$('title').value=data.title||currentTitle;$('body').value=data.body||currentBody}
async function loadRecords(type){const target=$('records');if(!target)return;target.innerHTML='<p class="muted">डेटा लोड होत आहे...</p>';try{const snap=await getDocs(query(collection(db,type),orderBy('createdAt','desc'),limit(100)));if(snap.empty){target.innerHTML='<p class="muted">अजून नोंदी नाहीत.</p>';return}const isMembership=type==='members'||type==='membership';target.innerHTML=snap.docs.map(item=>{const x=item.data(),status=x.status||'',title=x.headline||x.caption||x.name||x.title||'सदस्य अर्ज';return`<article class="record ${isMembership?'clickable':''}" ${isMembership?`data-member="${item.id}"`:''}><div class="record-head"><div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(x.role||x.phone||x.description||'')}</p><small>${dateValue(x.createdAt)}</small></div><div class="record-actions">${status?`<span class="badge ${status}">${escapeHtml(status)}</span>`:''}${isMembership?'<button type="button" class="primary record-open">तपशील / प्रक्रिया</button>':''}</div></div></article>`}).join('');if(isMembership)target.querySelectorAll('[data-member]').forEach(card=>card.addEventListener('click',()=>openMember(card.dataset.member)))}catch(error){target.innerHTML=`<p class="status error">नोंदी लोड झाल्या नाहीत: ${escapeHtml(error.message)}</p>`}}
function render(type){active=type;document.querySelectorAll('#tabs button').forEach(button=>button.classList.toggle('active',button.dataset.tab===type));const schema=type==='membership'?{title:'सदस्यत्व अर्ज',fields:[]}:schemas[type];$('panel').innerHTML=`<div class="panel-card"><div class="section-head"><div><h2>${schema.title}</h2><p class="muted">${type==='website'?'पेज निवडा आणि त्यातील मजकूर खाली संपादित करा.':'सर्व माहिती Firebase मध्ये सुरक्षितपणे जतन होते.'}</p></div></div>${type==='membership'?'<div id="records" class="records"></div>':formHtml(schema)}${type!=='membership'&&type!=='website'?'<div id="records" class="records"></div>':''}</div>`;if(type==='membership')loadRecords('members');else{if(type==='website'){$('pageKey').addEventListener('change',e=>loadWebsite(e.target.value));loadWebsite($('pageKey').value)}$('dataForm').addEventListener('submit',saveRecord);if(type!=='website')loadRecords(type)}}
async function openMember(id){try{const snap=await getDoc(doc(db,'members',id));if(!snap.exists())throw Error('अर्ज सापडला नाही');const x=snap.data();const labels={salutation:'संबोधन',name:'पूर्ण नाव',firstName:'प्रथम नाव',middleName:'मधले नाव',lastName:'आडनाव',email:'ई-मेल',phone:'WhatsApp मोबाईल नंबर',district:'जिल्हा',taluka:'तालुका',basicUnit:'मूल केंद्र / बीट',currentPost:'सध्या कार्यरत पद',hasOrganizationPost:'संघटनेत पदावर आहेत काय?',organizationPost:'संघटनेतील पद',address:'पूर्ण पत्ता',education:'शैक्षणिक पात्रता',birthDate:'जन्मतारीख',family:'कुटुंबातील सदस्य',hobby:'छंद',paymentAmount:'सदस्य फी',status:'अर्ज स्थिती',membershipNumber:'सदस्य क्रमांक'};const links=[];for(const key of ['photo','paymentScreenshot']){const path=x[key+'Path'];if(path){try{const label=key==='photo'?'पासपोर्ट फोटो उघडा':'₹500 payment screenshot उघडा';const url=await getDownloadURL(ref(storage,path));links.push('<a href="'+escapeHtml(url)+'" target="_blank" rel="noopener">'+label+'</a>')}catch{const missing=key==='photo'?'पासपोर्ट फोटो':'Payment screenshot';links.push('<span class="muted">'+missing+' उपलब्ध नाही</span>')}}}$('modalRoot').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-card"><h2>${escapeHtml(x.name||'सदस्य अर्ज')}</h2><div class="detail-grid">${Object.entries(x).filter(([key])=>!key.endsWith('Path')&&!key.endsWith('Url')&&key!=='createdAt'&&key!=='updatedAt').map(([key,value])=>`<div class="detail"><strong>${escapeHtml(labels[key]||key)}</strong>${escapeHtml(value?.toDate?dateValue(value):value)}</div>`).join('')}</div><div class="doc-links">${links.join('')}</div><div class="modal-actions"><button class="close" id="closeMember">बंद करा</button><button class="reject" id="rejectMember">अर्ज नाकारला</button><button class="approve" id="approveMember">अर्ज मंजूर करा</button></div></div></div>`;$('closeMember').onclick=closeMember;$('approveMember').onclick=()=>changeMember(id,'approved');$('rejectMember').onclick=()=>changeMember(id,'rejected')}catch(error){saveMessage(error.message,true)}}
function closeMember(){$('modalRoot').innerHTML=''}
async function changeMember(id,status){try{const number=status==='approved'?await nextNumber():'';await updateDoc(doc(db,'members',id),{status,membershipNumber:number,updatedAt:serverTimestamp()});closeMember();await loadRecords('members')}catch(error){alert(error.message||'सदस्यत्व अपडेट झाले नाही')}}
async function nextNumber(){const snap=await getDocs(query(collection(db,'members'),limit(500)));return String(snap.docs.reduce((max,item)=>Math.max(max,Number(item.data().membershipNumber)||0),0)+1).padStart(4,'0')}
async function start(){try{const config=await fetch('/api/firebase-config',{cache:'no-store'}).then(r=>r.json());app=initializeApp(config.membership);auth=getAuth(app);db=getFirestore(app);storage=getStorage(app);onAuthStateChanged(auth,user=>{if(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');render(active)}});$('loginBtn').disabled=false}catch(error){setMessage(error.message||'Firebase सुरू झाले नाही',true)}}
$('loginBtn').addEventListener('click',async()=>{const button=$('loginBtn');button.disabled=true;button.textContent='तपासत आहे...';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);setMessage('')}catch(error){setMessage(error.code==='auth/invalid-credential'?'Email किंवा password चुकीचा आहे.':error.message,true);button.disabled=false;button.textContent='Login करा'}});$('logout').addEventListener('click',()=>signOut(auth));$('tabs').addEventListener('click',event=>{const button=event.target.closest('[data-tab]');if(button)render(button.dataset.tab)});start();
</script>
</body></html>
